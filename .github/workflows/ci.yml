# 읽기 조건: CI가 실패했을 때 어느 잡/스텝인지 확인하려고, 또는 워크플로를 수정할 때.
# 원칙: 검사 목록의 단일 소스는 scripts/check.sh 다(로컬 훅과 동일 동작). 여기서는 guard/build
# 각 잡에서 `bash scripts/check.sh --guard`/`--build` 를 한 스텝으로 한 번씩만 호출한다(로직을
# 다시 나열하지 않는다). 검사별로 스텝을 쪼개지 않고 묶은 이유: check.sh 의 run_step 이 검사
# 하나가 실패해도 나머지를 끝까지 돌려 그 실행 안에서 실패를 전부 보여주기 때문 — 스텝을 쪼개
# fail-fast 하면 첫 실패 이후 검사 결과를 같은 실행에서 볼 수 없다. 어느 검사가 실패했는지는
# 로그의 "FAIL: <라벨>" 줄과 check.sh 가 내는 `::error::` 애노테이션으로 PR 체크 요약에서도 보인다.
# 세 번째 잡 `perf` 는 예외다 — 느린 스위트는 **의도적으로 PR 게이트 밖**이라 check.sh 를 거치지
# 않고 main push 에서만 돈다. 이유는 그 잡의 주석에 있다.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: "true"

jobs:
  guard:
    name: guard (금지어 · author · 브랜치명 · AGENTS.md)
    runs-on: ubuntu-latest
    steps:
      - name: 체크아웃 (PR은 머지 커밋이 아닌 head 커밋을 검사)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: 스크립트 실행 권한
        run: |
          chmod +x scripts/*.sh || true
          find .githooks -maxdepth 1 -type f ! -name '*.md' -exec chmod +x {} + || true

      - name: guard 검사 (금지어 · 자격증명 파일(.env) · AGENTS.md 구조 · author/트레일러)
        run: bash scripts/check.sh --guard "${{ github.base_ref || 'main' }}"

      - name: wt.sh 스모크 테스트 (/tmp 샌드박스 — 원본 레포는 건드리지 않음)
        run: bash scripts/check.sh wt

      - name: 브랜치명 규칙 검사 (PR)
        if: github.event_name == 'pull_request'
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if ! printf '%s' "$HEAD_REF" | grep -qE '^(feature|fix|refactor|docs|chore|test)/[a-z0-9]+(-[a-z0-9]+)*$'; then
            echo "::error::브랜치명 규칙 위반: '$HEAD_REF' → <type>/<kebab-name> (type: feature|fix|refactor|docs|chore|test). 에이전트 이름 기반 브랜치 금지."
            exit 1
          fi
          echo "OK branch: $HEAD_REF"

      - name: PR 제목 형식 검사 (squash 커밋 제목이 됨)
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          printf '%s\n' "$PR_TITLE" > "$RUNNER_TEMP/pr-title.txt"
          bash scripts/check-author.sh --message-file "$RUNNER_TEMP/pr-title.txt"
          bash scripts/check-forbidden-words.sh --text-file "$RUNNER_TEMP/pr-title.txt"

      - name: PR 본문 AI 서명 · 금지어 검사
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s\n' "$PR_BODY" > "$RUNNER_TEMP/pr-body.txt"
          bash scripts/check-author.sh --body-file "$RUNNER_TEMP/pr-body.txt"
          bash scripts/check-forbidden-words.sh --text-file "$RUNNER_TEMP/pr-body.txt"

  build:
    name: build (lint · typecheck · test · build)
    runs-on: ubuntu-latest
    needs: guard
    steps:
      - uses: actions/checkout@v7

      - name: package.json 존재 확인 (스캐폴딩 전에는 이후 스텝 생략)
        id: pkg
        run: |
          if [ -f package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::package.json 없음 — 스캐폴딩 전이므로 build 잡을 건너뜁니다."
          fi

      - name: pnpm 설치
        if: steps.pkg.outputs.present == 'true'
        uses: pnpm/action-setup@v4

      - name: Node 설치
        if: steps.pkg.outputs.present == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: 의존성 설치
        if: steps.pkg.outputs.present == 'true'
        run: pnpm install --frozen-lockfile

      - name: build 검사 (lint · 레이어 경계 린트 + 아키텍처 2차 패스 · typecheck · format:check · test)
        if: steps.pkg.outputs.present == 'true'
        run: bash scripts/check.sh --build

      - name: build
        if: steps.pkg.outputs.present == 'true'
        run: pnpm build

      - name: 빌드 산출물에 금지어 없음 확인 (생성 파일 포함)
        if: steps.pkg.outputs.present == 'true'
        run: bash scripts/check-forbidden-words.sh --paths dist/client public

  perf:
    # **PR 에는 일부러 붙이지 않는다.** 성능 측정은 러너 상태에 흔들린다 — T-24 실측에서 재정렬
    # `max` 진폭이 1.67~34.5ms(20배)였고 같은 실행의 p95 는 0.10~0.24ms 였다(GC 일시정지). 이걸
    # PR 게이트로 쓰면 회귀가 아니라 잡음에 빨간불이 켜져 멀쩡한 PR 의 머지가 막힌다. 그래서
    # **main 에 들어간 뒤에만** 돌려 회귀를 기록한다(`if: github.event_name == 'push'`).
    # 예산은 `max` 가 아니라 **p95** 로 견주므로(todo-perf.slow.test.ts 상단 주석) 튀는 `max` 로는
    # 실패하지 않는다. 여유도 크다 — 실측 p95 0.097/0.152/0.094ms 대 예산 50/5/5ms.
    #
    # 이 잡만 `scripts/check.sh` 를 거치지 않고 `pnpm test:slow` 를 직접 부른다. check.sh 는 **PR
    # 게이트의 단일 소스**이고 느린 스위트는 의도적으로 그 게이트 밖이기 때문이다 — check.sh 에
    # 넣으면 로컬 훅과 PR 잡에도 딸려 들어가 위의 결정이 뒤집힌다.
    name: perf (느린 스위트 — main 머지 후 측정 · PR 게이트 아님)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: pnpm 설치
        uses: pnpm/action-setup@v4

      - name: Node 설치
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: 의존성 설치
        run: pnpm install --frozen-lockfile

      - name: 느린 스위트 (성능 예산 — 측정값은 이 스텝 로그의 `[perf]` 줄)
        run: pnpm test:slow
