<!doctype html>
<html lang="ko">
  <head>
    <!--
      이 주석 덩어리는 반드시 <head> **안**에 둔다. `<!doctype html>` 바로 뒤는 Vite dev 서버가
      react-refresh preamble 과 /@vite/client 를 주입하는 자리라, 거기에 주석을 두면 주입된
      스크립트가 주석 안에 갇혀 실행되지 않는다 — `@vitejs/plugin-react can't detect preamble`
      로 dev 화면이 빈 채로 뜬다. 프로덕션 빌드는 preamble 을 주입하지 않아 증상이 안 보이고,
      검증이 전부 `pnpm build` 산출물로 갔던 탓에 PR #25 이후 줄곧 깨진 채였다.
    -->
    <!--
    읽기 조건: 문서 <head>(메타·테마 첫 페인트 스크립트·폰트 preload)나 SPA 진입점을 바꿀 때.
  
    Vite 의 빌드 진입점이다(ADR-0013). 예전에는 같은 내용을 `src/app/layout.tsx` 의 `metadata` 와
    JSX <head> 가 만들어 프리렌더 HTML 로 떨어뜨렸다 — Vinext 를 걷어내면서 그 자리를 이 파일이 받는다.
  
    순서가 계약이다:
    1) theme-color 메타가 아래 스크립트보다 **먼저** 나온다(스크립트가 querySelector 로 찾아 덮어쓴다).
    2) 테마 스크립트는 **동기 인라인**이다. async·defer·type=module·외부 src 로 바꾸면 다크 사용자가
       흰 화면을 한 프레임 본다(theme R6·R11).
    3) 아래 스크립트 본문은 `THEME_INIT_SCRIPT`(src/features/theme/store/theme-head.ts)와 **바이트가 같아야**
       한다. 그 상수는 vitest 가 실제로 실행해 TS 경로와 대조하는 "검증 가능한 사본"이고, 여기 있는 것이
       실제로 나가는 사본이다. 둘이 갈라지면 theme-head.test.ts 의 'index.html 배선' 이 실패한다.
  -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <title>Tasky</title>
    <meta name="description" content="감성 투두·일정 관리 웹앱" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <!--
      iOS 는 홈 화면 아이콘으로 manifest 의 아이콘 대신 이 링크를 먼저 본다. 이 줄이 없으면
      Safari 가 페이지 스크린샷을 아이콘으로 쓴다. iOS 는 투명 픽셀을 검정으로 합성할 수
      있으므로 `icon-apple-touch-180.png` 는 180×180 불투명 RGB 원본에서 만든다(public/AGENTS.md).
    -->
    <link rel="apple-touch-icon" href="/icon-apple-touch-180.png" />
    <meta name="theme-color" content="#FAFAFC" />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/PretendardVariable.subset-74f8c71d.woff2"
      crossorigin="anonymous"
    />
    <!-- prettier-ignore -->
    <script>(function(){try{var e=document.documentElement;var s=null;try{var r=window.localStorage.getItem("tasky.theme.v1");if(r)s=JSON.parse(r)}catch(_){}var m=s&&(s.theme==="light"||s.theme==="dark"||s.theme==="system")?s.theme:"system";var q=window.matchMedia;var d=m==="dark"||(m==="system"&&typeof q==="function"&&q("(prefers-color-scheme: dark)").matches);var t=d?"dark":"light";e.setAttribute("data-theme",t);e.style.setProperty("color-scheme",t);var a=s&&s.accent?s.accent[t]:null;if(typeof a==="string"&&/^#[0-9A-Fa-f]{6}$/.test(a))e.style.setProperty("--color-accent",a);var c=document.querySelector('meta[name="theme-color"]');if(c)c.setAttribute("content",d?"#141418":"#FAFAFC");}catch(_){}})();</script>
    <!-- 초대 원문은 모듈과 분석 스크립트 실행 전에 주소에서 지운다. 로그인 왕복에만 탭 저장소를 쓴다. -->
    <script>
      (function () {
        function consumeInvite() {
          if (!window.location.hash.startsWith('#invite=')) return;
          var token = window.location.hash.slice(8);
          window.history.replaceState(null, '', window.location.pathname + window.location.search);
          try {
            window.sessionStorage.removeItem('tasky.social.invite.v1');
            if (/^[0-9a-f]{64}$/.test(token))
              window.sessionStorage.setItem(
                'tasky.social.invite.v1',
                JSON.stringify({ token: token, savedAt: Date.now() }),
              );
          } catch (_) {
            /* 탭 저장이 불가능하면 원문을 복원하지 않는다. */
          }
          window.dispatchEvent(new Event('tasky-social-invite'));
        }
        consumeInvite();
        window.addEventListener('hashchange', consumeInvite);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
    <!--
      Cloudflare Web Analytics 비콘. 쿠키 없이 익명 페이지뷰만 센다. 로그인 게이트(AuthGate)와
      무관하게 모든 방문에서 실행되도록 <body> 에 두되, 앱 진입 모듈 스크립트 **뒤**에 둔다 —
      Vite 빌드는 위 모듈 스크립트를 <head> 로 끌어올리므로(모든 modulepreload 링크와 함께),
      defer 스크립트와 모듈 스크립트는 같은 순서 실행 큐를 공유해 비콘이 앞서면 느리거나 막힌
      static.cloudflareinsights.com 요청이 앱 부팅(AuthGate/LoginScreen)을 지연시킨다. 소스에서
      이 태그를 앱 스크립트보다 뒤에 두면 빌드 후에도 head 의 모듈 스크립트보다 뒤에 남아
      순서 문제가 사라진다(`pnpm build` 후 dist/client/index.html 로 확인). data-cf-beacon 의
      token 은 페이지 소스에 그대로 노출되는 공개 값이라 비밀이 아니다(.env.example 참고).
    -->
    <script
      defer
      src="https://static.cloudflareinsights.com/beacon.min.js"
      data-cf-beacon='{"token": "d5be062eb83c46b9b9f5eb621f7a1342"}'
    ></script>
  </body>
</html>
